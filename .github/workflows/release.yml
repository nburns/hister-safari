name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'HISTER_VERSION override (leave blank for day-of-year stamp; dispatch never publishes a release, only uploads an artifact)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      # Third-party actions pinned to full commit SHAs (defense against
      # tag-mutation / action-repo compromise). Version tags in comments; bump
      # via `gh api /repos/<owner>/<repo>/git/refs/tags/<tag>`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import Developer ID cert
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

      - name: Populate ExportOptions.plist team ID
        run: |
          /usr/libexec/PlistBuddy \
              -c "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" \
              Safari/ExportOptions.plist

      # Resolve HISTER_VERSION per event:
      #   tag push       -> v0.0.1[-rc.N] (from git ref)
      #   main push      -> v0.<day>.<h>.<m> (auto)
      #   dispatch input -> whatever user typed, or blank -> day stamp
      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" && "$REF_TYPE" == "tag" ]]; then
              V="$REF_NAME"
          elif [[ "$EVENT" == "push" ]]; then
              V="v0.$(date +%-j.%-H.%-M)"
          elif [[ -n "$DISPATCH_INPUT" ]]; then
              V="$DISPATCH_INPUT"
          else
              V=""  # build.sh will fall back to day-of-year
          fi
          echo "hister_version=$V" >> "$GITHUB_OUTPUT"
          echo "==> HISTER_VERSION=$V"

      - name: Build, sign, notarize
        env:
          CODE_SIGN_IDENTITY: Developer ID Application
          NOTARIZE: '1'
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HISTER_VERSION: ${{ steps.version.outputs.hister_version }}
        run: scripts/build.sh

      - name: Release notes
        id: notes
        run: |
          UPSTREAM_SHA="$(git -C vendor/hister rev-parse HEAD)"
          {
              echo "notes<<EOF"
              echo "Unofficial Safari build of Hister."
              echo
              echo "Built from upstream commit \`$UPSTREAM_SHA\`."
              echo "Signed with an Apple Developer ID and notarized by Apple."
              echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Publish paths -----------------------------------------------------

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: build/Hister-*.dmg
          tag_name: ${{ steps.version.outputs.hister_version }}
          body: ${{ steps.notes.outputs.notes }}
          fail_on_unmatched_files: true

      - name: Upload artifact (dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hister-dmg
          path: build/Hister-*.dmg
          if-no-files-found: error
